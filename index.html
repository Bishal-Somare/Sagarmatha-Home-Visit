<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Home Visit Form</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="container">

  <header>

    <h1>Home Visit Form</h1>

    <p>
      Details of Homely Activities of Students
    </p>

  </header>


  <div
    id="message"
    class="message"
  ></div>


  <form
    id="homeVisitForm"
  >


    <section>

      <h2>Visit Information</h2>

      <div class="field">

        <label>
          Visit Date
        </label>

        <input
          type="date"
          name="visitDate"
        >

      </div>

    </section>


    <section>

      <h2>Student Information</h2>

      <div class="grid">


        <div class="field full">

          <label>
            Student Name *
          </label>

          <input
            type="text"
            name="studentName"
            required
          >

        </div>


        <div class="field">

          <label>
            Class *
          </label>

          <select
            id="className"
            name="className"
            required
            disabled
          >

            <option>
              Loading classes...
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Section *
          </label>

          <select
            id="section"
            name="section"
            required
            disabled
          >

            <option>
              Select Section
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Roll No *
          </label>

          <input
            type="number"
            name="rollNo"
            min="1"
            required
          >

        </div>


        <div class="field">

          <label>
            No. of Siblings
          </label>

          <input
            type="number"
            name="siblings"
            min="0"
          >

        </div>


        <div class="field">

          <label>
            Father's Name
          </label>

          <input
            type="text"
            name="fatherName"
          >

        </div>


        <div class="field">

          <label>
            Mother's Name
          </label>

          <input
            type="text"
            name="motherName"
          >

        </div>


        <div class="field">

          <label>
            Occupation
          </label>

          <input
            type="text"
            name="occupation"
          >

        </div>


        <div class="field">

          <label>
            Contact
          </label>

          <input
            type="tel"
            name="contact"
          >

        </div>


        <div class="field full">

          <label>
            Address
          </label>

          <textarea
            name="address"
            rows="3"
          ></textarea>

        </div>

      </div>

    </section>


    <section>

      <h2>Student Activities</h2>


      <div class="field">

        <label>
          He/She does reading homework in 
        </label>

        <textarea
          name="readingHomework"
        ></textarea>

      </div>


      <div class="field">

        <label>
          He/She does writing homework in 
        </label>

        <textarea
          name="writingHomework"
        ></textarea>

      </div>


      <div class="field">

        <label>
         He/She is much interested in
        </label>

        <textarea
          name="interestedIn"
        ></textarea>

      </div>


      <div class="field">

        <label>
          Behaviour With Family
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="familyBehaviour"
              value="Good"
            >
            Good
          </label>

          <label>
            <input
              type="radio"
              name="familyBehaviour"
              value="Average"
            >
            Average
          </label>

          <label>
            <input
              type="radio"
              name="familyBehaviour"
              value="Bad"
            >
            Bad
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          Response To Guests
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="guestResponse"
              value="Properly"
            >
            Properly
          </label>

          <label>
            <input
              type="radio"
              name="guestResponse"
              value="Average"
            >
            Average
          </label>

          <label>
            <input
              type="radio"
              name="guestResponse"
              value="Coldly"
            >
            Coldly
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          Keeps Things In Original Place
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="keepThings"
              value="Yes"
            >
            Yes
          </label>

          <label>
            <input
              type="radio"
              name="keepThings"
              value="No"
            >
            No
          </label>

          <label>
            <input
              type="radio"
              name="keepThings"
              value="Sometimes"
            >
            Sometimes
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          Eats Junk Food
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="junkFood"
              value="Yes"
            >
            Yes
          </label>

          <label>
            <input
              type="radio"
              name="junkFood"
              value="No"
            >
            No
          </label>

          <label>
            <input
              type="radio"
              name="junkFood"
              value="Sometimes"
            >
            Sometimes
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          Mobile/Laptop
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="mobileLaptop"
              value="Properly"
            >
            Properly
          </label>

          <label>
            <input
              type="radio"
              name="mobileLaptop"
              value="Commonly"
            >
            Commonly
          </label>

          <label>
            <input
              type="radio"
              name="mobileLaptop"
              value="Too much"
            >
            Too much
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          Watch TV
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="tvWatching"
              value="Sometimes only"
            >
            Sometimes only
          </label>

          <label>
            <input
              type="radio"
              name="tvWatching"
              value="Commonly"
            >
            Commonly
          </label>

          <label>
            <input
              type="radio"
              name="tvWatching"
              value="Too much"
            >
            Too much
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          Assists Household Activities
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="householdActivities"
              value="Yes"
            >
            Yes
          </label>

          <label>
            <input
              type="radio"
              name="householdActivities"
              value="No"
            >
            No
          </label>

          <label>
            <input
              type="radio"
              name="householdActivities"
              value="Sometimes"
            >
            Sometimes
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          Washes Personal Clothes/Dishes
        </label>

        <div class="radio-group">

          <label>
            <input
              type="radio"
              name="personalClothes"
              value="Yes"
            >
            Yes
          </label>

          <label>
            <input
              type="radio"
              name="personalClothes"
              value="No"
            >
            No
          </label>

          <label>
            <input
              type="radio"
              name="personalClothes"
              value="Sometimes"
            >
            Sometimes
          </label>

        </div>

      </div>


      <div class="field">

        <label>
          What does the student say about school, teacher and friends?
        </label>

        <textarea
          name="schoolOpinion"
          rows="4"
        ></textarea>

      </div>

    </section>


    <section>

      <h2>
        Guardian Information
      </h2>


      <div id="guardianFields">

        <div class="field">

          <label>
            Guardian Appreciates Child
          </label>

          <div class="radio-group">

            <label>
              <input
                type="radio"
                name="guardianAppreciates"
                value="Yes"
              >
              Yes
            </label>

            <label>
              <input
                type="radio"
                name="guardianAppreciates"
                value="No"
              >
              No
            </label>

            <label>
              <input
                type="radio"
                name="guardianAppreciates"
                value="Sometimes"
              >
              Sometimes
            </label>

          </div>

        </div>


        <div class="field">

          <label>
            Guardian Involves Child In Social Activities
          </label>

          <div class="radio-group">

            <label>
              <input
                type="radio"
                name="guardianSocialActivities"
                value="Yes"
              >
              Yes
            </label>

            <label>
              <input
                type="radio"
                name="guardianSocialActivities"
                value="No"
              >
              No
            </label>

            <label>
              <input
                type="radio"
                name="guardianSocialActivities"
                value="Sometimes"
              >
              Sometimes
            </label>

          </div>

        </div>


        <div class="field">

          <label>
            Guardian Keeps Child Informed About Family
          </label>

          <div class="radio-group">

            <label>
              <input
                type="radio"
                name="guardianFamilyInformation"
                value="Yes"
              >
              Yes
            </label>

            <label>
              <input
                type="radio"
                name="guardianFamilyInformation"
                value="No"
              >
              No
            </label>

            <label>
              <input
                type="radio"
                name="guardianFamilyInformation"
                value="Sometimes"
              >
              Sometimes
            </label>

          </div>

        </div>


        <div class="field">

          <label>
            Guardian Gives Time To Child
          </label>

          <div class="radio-group">

            <label>
              <input
                type="radio"
                name="guardianTime"
                value="Yes"
              >
              Yes
            </label>

            <label>
              <input
                type="radio"
                name="guardianTime"
                value="No"
              >
              No
            </label>

            <label>
              <input
                type="radio"
                name="guardianTime"
                value="Sometimes"
              >
              Sometimes
            </label>

          </div>

        </div>


        <div class="field">

          <label>
            Guardian Attends Guardian Programs
          </label>

          <div class="radio-group">

            <label>
              <input
                type="radio"
                name="guardianPrograms"
                value="Yes"
              >
              Yes
            </label>

            <label>
              <input
                type="radio"
                name="guardianPrograms"
                value="No"
              >
              No
            </label>

            <label>
              <input
                type="radio"
                name="guardianPrograms"
                value="Sometimes"
              >
              Sometimes
            </label>

          </div>

        </div>


        <div class="field">

          <label>
            Guardian Encourages Child Despite Simple Mistakes
          </label>

          <div class="radio-group">

            <label>
              <input
                type="radio"
                name="guardianMistakes"
                value="Yes"
              >
              Yes
            </label>

            <label>
              <input
                type="radio"
                name="guardianMistakes"
                value="No"
              >
              No
            </label>

            <label>
              <input
                type="radio"
                name="guardianMistakes"
                value="Sometimes"
              >
              Sometimes
            </label>

          </div>

        </div>

      </div>

    </section>


    <section>

      <h2>
        New Student Information
      </h2>

      <div class="grid">

        <div class="field">

          <label>
            New Student Name
          </label>

          <input
            type="text"
            name="newStudentName"
          >

        </div>


        <div class="field">

          <label>
            New Student Address
          </label>

          <input
            type="text"
            name="newStudentAddress"
          >

        </div>

      </div>

    </section>


    <button
      type="submit"
      id="submitButton"
    >
      Submit Home Visit
    </button>


  </form>


  <footer>
    Developed by Jay Bhandari and Bishal Somare Magar
    contact:9744313036
  </footer>

</div>


<script src="script.js"></script>

</body>

</html>
